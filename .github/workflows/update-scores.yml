name: Update marching scores

on:
  schedule:
    # Sept through Nov: early morning and late evening Mountain time, every day.
    # Recaps usually post Saturday night; regionals and State run on weekdays.
    - cron: "0 12 * 9-11 *"   # ~6 am MT
    - cron: "0 5 * 9-11 *"    # ~11 pm MT
  workflow_dispatch: {}        # "Run workflow" button for a manual refresh
  push:                        # rebuild when you edit hand-entered scores, settings or code
    branches: [main]
    paths:
      - "config.json"
      - "data/manual_scores.csv"
      - "data/school_classes.csv"
      - "data/school_aliases.csv"
      - "*.py"
      - "dashboard_template.html"
      - "notify.py"
      - ".github/workflows/update-scores.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update.py
      - name: Commit new data
        id: commit
        run: |
          git config user.name "score-bot"
          git config user.email "score-bot@users.noreply.github.com"
          git add data/*.csv data/*.json dashboard.html index.html
          if git diff --cached --quiet; then
            echo "No new scores."
          else
            git commit -m "Scores updated $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Send alerts if new scores came in
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py
      - name: Send a test alert (push with [notify-test] in the commit message)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[notify-test]')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py --test
